name: publish-verified-preview

on:
  workflow_run:
    workflows: [source-and-package]
    types: [completed]
    branches: [main]

# No token write permission in unrelated jobs or a PR-triggered run.
permissions:
  contents: read

concurrency:
  group: preview-release-v0.1.0
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
      RENGA_BRIDGE_RUN_INTEGRATION: '0'
      RELEASE_TAG: v0.1.0
    steps:
      - name: Check out precisely the successful main CI commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm commit and sanitized native evidence
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$VERIFIED_SHA"
          python scripts/verify_release_inputs.py
          test -s docs/RELEASE_NOTES_0.1.0.md
          if grep -Eq 'ROOT_FILL|TODO_RELEASE_PROOF|NOT_READY_FOR_PUBLICATION' docs/RELEASE_NOTES_0.1.0.md; then
            echo 'Release notes still contain unfilled native proof placeholders.' >&2
            exit 1
          fi
      - name: Build wheel and sdist using pinned package build requirements
        run: |
          python -m pip install 'build==1.6.1'
          python -m build --outdir dist
      - name: Audit packaged sources and exclude vendor/private artifacts
        run: python scripts/verify_release_inputs.py --archives dist
      - name: Publish versioned API preview without replacing an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Never replace a published version or upload over its existing assets.
          if gh release view "$RELEASE_TAG" --json tagName,isPrerelease,isDraft --jq '"\(.isPrerelease) \(.isDraft)"' > existing-release.txt 2>/dev/null; then
            if test "$(cat existing-release.txt)" != 'true false'; then
              echo 'Existing v0.1.0 is not a published prerelease; review it manually.' >&2
              exit 1
            fi
            echo 'Existing preview release detected; no release/tag/assets were changed.'
            exit 0
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" > /dev/null 2>&1; then
            echo 'Tag already exists without a matching published preview; refusing to retarget it.' >&2
            exit 1
          fi
          # GITHUB_TOKEN cannot target workflow changes relative to the current
          # default branch. Never substitute a newer, untested main commit.
          CURRENT_MAIN_SHA=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          if test "$CURRENT_MAIN_SHA" != "$VERIFIED_SHA"; then
            echo 'main advanced after this CI run; wait for successful CI of its exact head.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/*.whl dist/*.tar.gz \
            --target "$VERIFIED_SHA" --prerelease \
            --title 'v0.1.0 preview' \
            --notes-file docs/RELEASE_NOTES_0.1.0.md
